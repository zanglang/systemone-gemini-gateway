name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/systemone-gemini-gateway

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  image:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # used only on push to main
      security-events: write # SARIF upload
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 (loaded)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: systemone-gemini-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test
        run: scripts/image_smoke.sh systemone-gemini-gateway:ci

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: systemone-gemini-gateway:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload SARIF to code scanning
        # Fork PRs get a read-only token, so code scanning upload is skipped there.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy gate (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: systemone-gemini-gateway:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Export image for chart-install
        run: docker save systemone-gemini-gateway:ci --output "$RUNNER_TEMP/image.tar"
      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.licenses=MIT
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-platform (push only on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart-install:
    needs: [checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [secret-create, external-secret]
    env:
      HELM_VERSION: "v4.3.1"
      ESO_VERSION: "0.20.4"
      CHART_DIR: charts/systemone-gemini-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: s1gw
          wait: 120s
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      - name: Load image into kind
        run: |
          docker load --input "$RUNNER_TEMP/image/image.tar"
          docker tag systemone-gemini-gateway:ci "${IMAGE}:ci"
          kind load docker-image "${IMAGE}:ci" --name s1gw
      - name: Install External Secrets Operator
        if: matrix.mode == 'external-secret'
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm install external-secrets external-secrets/external-secrets \
            --version "${ESO_VERSION}" \
            --namespace external-secrets --create-namespace \
            --set installCRDs=true \
            --wait --timeout 5m
          kubectl apply -f "${CHART_DIR}/ci/kind/fake-clustersecretstore.yaml"
      - name: helm install
        env:
          MODE: ${{ matrix.mode }}
        run: |
          helm install gw "${CHART_DIR}" \
            -f "${CHART_DIR}/ci/kind-${MODE}-values.yaml" \
            --set image.repository="${IMAGE}" \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 3m
      - name: ExternalSecret is Ready
        if: matrix.mode == 'external-secret'
        run: kubectl wait externalsecret --all --for=condition=Ready --timeout=120s
      - name: Pod received GEMINI_API_KEY
        run: |
          pod="$(kubectl get pods -l app.kubernetes.io/instance=gw -o jsonpath='{.items[0].metadata.name}')"
          kubectl exec "$pod" -- sh -c 'test -n "$GEMINI_API_KEY"'
      - name: helm test
        run: helm test gw --logs
      - name: Dump cluster state
        if: failure()
        run: |
          kubectl get all,externalsecret -A || true
          kubectl describe pods || true
          for pod in $(kubectl get pods -o name); do
            echo "--- logs ${pod} ---"
            kubectl logs "$pod" --all-containers || true
          done
