# kind install leg "external-secret": ESO pointing at the fake ClusterSecretStore
# defined in ci/kind/fake-clustersecretstore.yaml. Image preloaded with `kind load`.
# Override image.tag with the tag of the image loaded into kind
# (helm install ... --set image.tag=<tag>).
image:
  tag: ci
  pullPolicy: Never

externalSecret:
  enabled: true
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: fake-store
  geminiApiKey:
    remoteRef:
      key: gemini-api-key
