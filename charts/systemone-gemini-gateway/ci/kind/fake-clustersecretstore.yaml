# CI only: ESO "fake" provider so the chart-install job needs no real vault.
# Apply after the External Secrets Operator CRDs are installed.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake-store
spec:
  provider:
    fake:
      data:
        - key: gemini-api-key
          value: dummy-key-for-ci
