{{- if .Values.externalSecret.enabled -}}
{{- $es := .Values.externalSecret -}}
{{- $_ := include "s1gw.validateSecretSource" . -}}
{{- if not $es.secretStoreRef.name -}}
{{- fail "externalSecret.secretStoreRef.name is required when externalSecret.enabled=true" -}}
{{- end -}}
{{- if and (not $es.geminiApiKey.remoteRef.key) (not $es.dataFrom) -}}
{{- fail "externalSecret.geminiApiKey.remoteRef.key is required when externalSecret.enabled=true (unless externalSecret.dataFrom supplies the key)" -}}
{{- end -}}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "s1gw.fullname" . }}
  labels:
    {{- include "s1gw.labels" . | nindent 4 }}
    {{- with $es.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $es.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name | quote }}
  target:
    name: {{ include "s1gw.secretName" . | quote }}
    creationPolicy: {{ $es.target.creationPolicy }}
    deletionPolicy: {{ $es.target.deletionPolicy }}
  {{- if or $es.geminiApiKey.remoteRef.key $es.inboundApiKeys.remoteRef.key $es.extraData }}
  data:
    {{- if $es.geminiApiKey.remoteRef.key }}
    - secretKey: {{ .Values.secretKeys.geminiApiKey }}
      remoteRef:
        key: {{ $es.geminiApiKey.remoteRef.key | quote }}
        {{- with $es.geminiApiKey.remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
    {{- if $es.inboundApiKeys.remoteRef.key }}
    - secretKey: {{ .Values.secretKeys.inboundApiKeys }}
      remoteRef:
        key: {{ $es.inboundApiKeys.remoteRef.key | quote }}
        {{- with $es.inboundApiKeys.remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
    {{- with $es.extraData }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
