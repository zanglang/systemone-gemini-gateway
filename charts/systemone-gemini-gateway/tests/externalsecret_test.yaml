suite: ExternalSecret (items 43a-43d)
templates:
  - templates/externalsecret.yaml
  - templates/secret.yaml
  - templates/deployment.yaml
release:
  name: rel
tests:
  # 43a
  - it: minimal ExternalSecret
    set:
      externalSecret:
        enabled: true
        secretStoreRef:
          name: fake-store
        geminiApiKey:
          remoteRef:
            key: gemini-api-key
    asserts:
      - isKind:
          of: ExternalSecret
        template: templates/externalsecret.yaml
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
        template: templates/externalsecret.yaml
      - equal:
          path: metadata.name
          value: rel-systemone-gemini-gateway
        template: templates/externalsecret.yaml
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: fake-store
        template: templates/externalsecret.yaml
      - equal:
          path: spec.refreshInterval
          value: 1h
        template: templates/externalsecret.yaml
      - equal:
          path: spec.target
          value:
            name: rel-systemone-gemini-gateway
            creationPolicy: Owner
            deletionPolicy: Retain
        template: templates/externalsecret.yaml
      - equal:
          path: spec.data
          value:
            - secretKey: GEMINI_API_KEY
              remoteRef:
                key: gemini-api-key
        template: templates/externalsecret.yaml
      - notExists:
          path: spec.data[0].remoteRef.property
        template: templates/externalsecret.yaml
      - notExists:
          path: spec.dataFrom
        template: templates/externalsecret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: rel-systemone-gemini-gateway
                key: GEMINI_API_KEY
        template: templates/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/secret.yaml

  # 43a: Deployment secretKeyRef follows target.name
  - it: Deployment secretKeyRef name equals externalSecret target.name
    set:
      externalSecret:
        enabled: true
        secretStoreRef:
          name: fake-store
        target:
          name: custom-target
        geminiApiKey:
          remoteRef:
            key: gemini-api-key
    asserts:
      - equal:
          path: spec.target.name
          value: custom-target
        template: templates/externalsecret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: custom-target
                key: GEMINI_API_KEY
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_API_KEYS
            valueFrom:
              secretKeyRef:
                name: custom-target
                key: INBOUND_API_KEYS
                optional: true
        template: templates/deployment.yaml

  # 43b
  - it: full ExternalSecret
    set:
      externalSecret:
        enabled: true
        apiVersion: external-secrets.io/v1beta1
        refreshInterval: 15m
        secretStoreRef:
          kind: SecretStore
          name: my-store
        target:
          name: my-target
          creationPolicy: Merge
          deletionPolicy: Delete
        geminiApiKey:
          remoteRef:
            key: gemini/gateway
            property: api_key
        inboundApiKeys:
          remoteRef:
            key: gemini/gateway
            property: inbound_keys
        extraData:
          - secretKey: EXTRA
            remoteRef:
              key: extra/key
        dataFrom:
          - extract:
              key: gemini/other
        labels:
          team: platform
        annotations:
          example.com/owner: platform
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
        template: templates/externalsecret.yaml
      - equal:
          path: spec.refreshInterval
          value: 15m
        template: templates/externalsecret.yaml
      - equal:
          path: spec.secretStoreRef
          value:
            kind: SecretStore
            name: my-store
        template: templates/externalsecret.yaml
      - equal:
          path: spec.target
          value:
            name: my-target
            creationPolicy: Merge
            deletionPolicy: Delete
        template: templates/externalsecret.yaml
      - equal:
          path: spec.data
          value:
            - secretKey: GEMINI_API_KEY
              remoteRef:
                key: gemini/gateway
                property: api_key
            - secretKey: INBOUND_API_KEYS
              remoteRef:
                key: gemini/gateway
                property: inbound_keys
            - secretKey: EXTRA
              remoteRef:
                key: extra/key
        template: templates/externalsecret.yaml
      - equal:
          path: spec.dataFrom
          value:
            - extract:
                key: gemini/other
        template: templates/externalsecret.yaml
      - equal:
          path: metadata.labels.team
          value: platform
        template: templates/externalsecret.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: systemone-gemini-gateway
        template: templates/externalsecret.yaml
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        template: templates/externalsecret.yaml

  # 43c
  - it: fails when secretStoreRef.name is empty
    set:
      externalSecret:
        enabled: true
        geminiApiKey:
          remoteRef:
            key: gemini-api-key
    asserts:
      - failedTemplate:
          errorPattern: "externalSecret.secretStoreRef.name is required"
        template: templates/externalsecret.yaml

  - it: fails when the Gemini remote key is empty and dataFrom is unset
    set:
      externalSecret:
        enabled: true
        secretStoreRef:
          name: fake-store
    asserts:
      - failedTemplate:
          errorPattern: "externalSecret.geminiApiKey.remoteRef.key is required"
        template: templates/externalsecret.yaml

  - it: renders without a shorthand data entry when dataFrom supplies the key
    set:
      externalSecret:
        enabled: true
        secretStoreRef:
          name: fake-store
        dataFrom:
          - extract:
              key: gemini/gateway
    asserts:
      - isKind:
          of: ExternalSecret
        template: templates/externalsecret.yaml
      - notExists:
          path: spec.data
        template: templates/externalsecret.yaml
      - equal:
          path: spec.dataFrom
          value:
            - extract:
                key: gemini/gateway
        template: templates/externalsecret.yaml

  # 43d
  - it: custom secretKeys flow to the ExternalSecret and the Deployment
    set:
      secretKeys:
        geminiApiKey: MY_GEMINI_KEY
        inboundApiKeys: MY_INBOUND_KEYS
      externalSecret:
        enabled: true
        secretStoreRef:
          name: fake-store
        geminiApiKey:
          remoteRef:
            key: gemini-api-key
        inboundApiKeys:
          remoteRef:
            key: inbound
    asserts:
      - equal:
          path: spec.data[0].secretKey
          value: MY_GEMINI_KEY
        template: templates/externalsecret.yaml
      - equal:
          path: spec.data[1].secretKey
          value: MY_INBOUND_KEYS
        template: templates/externalsecret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: rel-systemone-gemini-gateway
                key: MY_GEMINI_KEY
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_API_KEYS
            valueFrom:
              secretKeyRef:
                name: rel-systemone-gemini-gateway
                key: MY_INBOUND_KEYS
                optional: true
        template: templates/deployment.yaml
