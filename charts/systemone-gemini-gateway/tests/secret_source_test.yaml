suite: secret source validation (item 42)
templates:
  - templates/deployment.yaml
release:
  name: rel
tests:
  - it: fails when no secret source is set
    asserts:
      - failedTemplate:
          errorPattern: "exactly one secret source must be set"

  - it: fails when externalSecret and existingSecret are both set
    set:
      existingSecret: foo
      externalSecret:
        enabled: true
        secretStoreRef:
          name: store
        geminiApiKey:
          remoteRef:
            key: k
    asserts:
      - failedTemplate:
          errorPattern: "exactly one secret source must be set"

  - it: fails when externalSecret and secret.create are both set
    set:
      secret:
        create: true
        geminiApiKey: dummy
      externalSecret:
        enabled: true
        secretStoreRef:
          name: store
        geminiApiKey:
          remoteRef:
            key: k
    asserts:
      - failedTemplate:
          errorPattern: "exactly one secret source must be set"

  - it: fails when existingSecret and secret.create are both set
    set:
      existingSecret: foo
      secret:
        create: true
        geminiApiKey: dummy
    asserts:
      - failedTemplate:
          errorPattern: "exactly one secret source must be set"

  - it: renders with exactly one source
    set:
      existingSecret: foo
    asserts:
      - isKind:
          of: Deployment
