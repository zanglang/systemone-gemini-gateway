suite: plain Secret (item 43)
templates:
  - templates/secret.yaml
  - templates/deployment.yaml
release:
  name: rel
tests:
  - it: renders a Secret and the Deployment references it
    set:
      secret:
        create: true
        geminiApiKey: dummy-key
    asserts:
      - isKind:
          of: Secret
        template: templates/secret.yaml
      - equal:
          path: metadata.name
          value: rel-systemone-gemini-gateway
        template: templates/secret.yaml
      - equal:
          path: stringData.GEMINI_API_KEY
          value: dummy-key
        template: templates/secret.yaml
      - notExists:
          path: stringData.INBOUND_API_KEYS
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: rel-systemone-gemini-gateway
                key: GEMINI_API_KEY
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret"]
          pattern: "^[a-f0-9]{64}$"
        template: templates/deployment.yaml

  - it: marks the inboundApiKeys secretKeyRef optional
    set:
      secret:
        create: true
        geminiApiKey: dummy-key
        inboundApiKeys: "a,b"
    asserts:
      - equal:
          path: stringData.INBOUND_API_KEYS
          value: "a,b"
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_API_KEYS
            valueFrom:
              secretKeyRef:
                name: rel-systemone-gemini-gateway
                key: INBOUND_API_KEYS
                optional: true
        template: templates/deployment.yaml

  - it: fails when secret.create is true without a key
    set:
      secret:
        create: true
    asserts:
      - failedTemplate:
          errorPattern: "secret.geminiApiKey is required"
        template: templates/secret.yaml

  - it: does not render a checksum/secret annotation for an existing Secret
    set:
      existingSecret: foo
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/secret"]
        template: templates/deployment.yaml
