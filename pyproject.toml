[project]
name = "systemone-gemini-gateway"
version = "0.1.0"
description = "System One (Jev) API to Gemini Decisions API gateway"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-exporter-prometheus>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s1gw"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# Coverage gates:
#  * overall >= 90% via --cov-fail-under in addopts
#  * translate.py must be 100%: enforced by tests/test_coverage_gate.py, which
#    runs only when the whole suite ran with coverage, reads the coverage data
#    in a session-finish hook (see tests/conftest.py) and fails the session if
#    src/s1gw/translate.py is below 100%.
[tool.pytest.ini_options]
addopts = "--cov=s1gw --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real Gemini API (opt-in)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = false
source = ["s1gw"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
